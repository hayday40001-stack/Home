<!DOCTYPE html>
<html lang="th" data-skin="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ของในบ้าน</title>
<meta name="theme-color" content="#FFF9F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ของในบ้าน">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9F0; --surface:#FFFFFF; --sunk:#F6EEE2; --ink:#2F2A23; --text:#3A342C; --muted:#877B6C;
  --line:#EFE4D4; --accent:#3E8E5E; --accent-ink:#FFFFFF; --accent-soft:#E4F2E7; --butter:#FFF3D1;
  --ok-bg:#E4F2E7; --ok:#2E7048; --soon-bg:#FFF0BF; --soon:#7E5B00; --near-bg:#FFE1C6; --near:#A34D0B; --over-bg:#FBDCD5; --over:#AD3421;
  --shadow:0 1px 2px rgba(90,64,30,.05),0 6px 18px -8px rgba(90,64,30,.16);
  --body:"Anuphan","Noto Sans Thai","Leelawadee UI",system-ui,-apple-system,sans-serif;
  --display:"Mitr","Anuphan","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-skin="white"]{--bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F2F5F3;--line:#E6EBE8;--ink:#1F2A25;--text:#2B3530;--muted:#6C7A73;--butter:#FFF6D6;--shadow:0 1px 2px rgba(20,40,30,.05),0 6px 18px -8px rgba(20,40,30,.18)}
html[data-skin="dark"]{--bg:#1C1B18;--surface:#26241F;--sunk:#312E28;--ink:#F3EDE2;--text:#E7E0D4;--muted:#A89E8F;--line:#3A362F;--accent:#63BE88;--accent-ink:#10170F;--accent-soft:#2A3A2E;--butter:#3A3322;
  --ok-bg:#29392D;--ok:#8FD3A8;--soon-bg:#3D3419;--soon:#F2CB63;--near-bg:#43301F;--near:#F4A769;--over-bg:#472620;--over:#F4907D;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a,input,select,label,summary{touch-action:manipulation}
.tbtn{min-height:36px}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 18px 130px}
h1,h2,h3,.num{font-family:var(--display);font-weight:500;color:var(--ink)}

header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 16px}
header.top h1{margin:0;font-size:1.7rem;line-height:1.25}
header.top p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.me{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.me svg{width:22px;height:22px}

.search{position:relative;margin-bottom:16px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 14px 13px 44px;font-size:1rem;box-shadow:var(--shadow)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0}

.summary{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:22px;box-shadow:var(--shadow);margin-bottom:18px}
.summary button{border:0;background:none;padding:14px 8px;text-align:center;border-left:1px solid var(--line)}
.summary button:first-child{border-left:0}
.summary .num{display:block;font-size:1.75rem;line-height:1.15}
.summary span{font-size:.82rem;color:var(--muted)}
.summary .warn .num{color:var(--near)}

.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.hero{padding:18px 18px 8px;margin-bottom:14px}
.hero h2{margin:0 0 12px;font-size:1.25rem;display:flex;justify-content:space-between;align-items:baseline}
.hero h2 button{font-family:var(--body);font-size:.88rem;border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.alert{background:var(--butter);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.alert b{display:block;color:var(--ink);font-weight:600}
.alert p{margin:2px 0 6px;font-size:.92rem}
.alert button{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:.92rem}
.urow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.urow:first-of-type{border-top:0}
.urow .em{font-size:1.5rem;width:36px;text-align:center;flex:none}
.urow .nm{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;font-weight:500;color:var(--ink)}
.urow .nm small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);padding:16px;font-family:var(--display);font-size:1.08rem;margin:6px 0 22px;box-shadow:var(--shadow)}
.sec{font-size:1.05rem;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-family:var(--body);color:var(--muted);font-size:.85rem;font-weight:400}

.st{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.soon{background:var(--soon-bg);color:var(--soon)}
.st.near{background:var(--near-bg);color:var(--near)}.st.over{background:var(--over-bg);color:var(--over)}
.st.low{background:var(--sunk);color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip small{opacity:.65;margin-left:3px}
.filters{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

/* food cards */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.food{padding:14px;display:flex;flex-direction:column;gap:10px}
.food .top{display:flex;gap:12px;align-items:flex-start}
.pic{width:54px;height:54px;flex:none;border-radius:16px;background:var(--sunk);display:grid;place-items:center;font-size:1.9rem;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.food .info{flex:1;min-width:0}
.food .nm{font-weight:600;color:var(--ink);font-size:1.05rem;line-height:1.3;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.food .nm span{overflow:hidden;text-overflow:ellipsis}
.food .meta{font-size:.86rem;color:var(--muted);margin-top:2px}
.food .qline{font-size:.95rem;color:var(--ink);margin-top:1px}
.food .bottom{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;background:var(--sunk);border-radius:12px}
.step button{border:0;background:none;width:34px;height:36px;font-size:1.2rem;color:var(--ink);border-radius:12px}
.step button:active{background:var(--line)}
.step span{min-width:34px;text-align:center;font-size:.9rem;font-weight:600;color:var(--ink)}
.acts{margin-left:auto;display:flex;gap:4px}
.tbtn{border:0;background:none;padding:8px 7px;border-radius:10px;font-size:.88rem;font-weight:600;color:var(--ink)}
.tbtn:active{background:var(--sunk)}
.tbtn.go{color:var(--accent)}
.tbtn.cart{color:var(--muted);padding:6px}
.tbtn.cart.hot{color:var(--accent)}
.tbtn svg{width:20px;height:20px;display:block}

.empty{padding:22px 18px;color:var(--muted);text-align:center}
.empty .big{font-size:2.4rem;display:block;margin-bottom:4px}
.empty p{margin:0 0 14px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--over-bg);color:var(--over)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:110px}

/* recipes */
.rec{padding:14px 16px;margin-bottom:10px}
.rec .rh{display:flex;gap:12px;align-items:center}
.rec .re{font-size:1.9rem;width:48px;height:48px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;flex:none}
.rec h3{margin:0;font-size:1.05rem}
.rec .rm{font-size:.84rem;color:var(--muted)}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.use{font-size:.84rem;padding:3px 10px;border-radius:999px;background:var(--sunk)}
.use.hot{background:var(--near-bg);color:var(--near);font-weight:600}
.use.miss{background:none;border:1px dashed var(--line);color:var(--muted)}
.rec details{margin-top:8px}
.rec summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;list-style:none}
.rec summary::-webkit-details-marker{display:none}
.rec ol,.rec .how{margin:6px 0 0;font-size:.93rem;padding-left:20px}
.rec .how{padding-left:0}
.focus{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:.92rem;color:var(--muted)}
.ai{padding:16px;margin-bottom:18px;background:var(--butter);box-shadow:none}
.ai p{margin:0 0 10px;font-size:.92rem}

/* shopping */
.addline{display:flex;gap:8px;margin-bottom:14px}
.addline input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.addline input:focus{outline:2px solid var(--accent);outline-offset:0}
.srow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .em{font-size:1.35rem;width:30px;text-align:center}
.srow .nm{flex:1;min-width:0}
.srow .nm small{display:block;color:var(--muted);font-size:.82rem}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;color:transparent}
.tick:active{border-color:var(--accent)}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;padding:4px 8px}
.list{overflow:hidden}

/* stats */
.stat-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-top .card{padding:14px 16px}
.stat-top .num{font-size:1.7rem;display:block;line-height:1.2}
.stat-top span{font-size:.85rem;color:var(--muted)}
.insight{padding:14px 16px;margin-bottom:12px;background:var(--accent-soft);box-shadow:none;color:var(--ink)}
.bars .b{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:.92rem}
.bars .b span:first-child{width:108px;flex:none}
.bars .track{flex:1;height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--near);border-radius:6px}
.bars .b span:last-child{width:34px;text-align:right;color:var(--muted)}
.pad{padding:14px 16px}

/* replacement items (kept) */
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.days{width:56px;flex:none;text-align:center;border-radius:14px;padding:6px 0;background:var(--sunk)}
.days b{display:block;font-family:var(--display);font-weight:500;font-size:1.35rem;line-height:1.1;color:var(--ink)}
.days span{display:block;font-size:.72rem;color:var(--muted)}
.row.over .days{background:var(--over-bg)}.row.over .days b,.row.over .days span{color:var(--over)}
.row.soon .days{background:var(--soon-bg)}.row.soon .days b,.row.soon .days span{color:var(--soon)}
.row .info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.row .name{font-weight:600;color:var(--ink)}
.row .meta{font-size:.84rem;color:var(--muted)}
.bar{height:4px;border-radius:4px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row.soon .bar i{background:var(--soon)}.row.over .bar i{background:var(--over)}
.act{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:.86rem;font-weight:600;color:var(--ink)}

/* settings */
.set{padding:4px 16px}
.set .it{padding:14px 0;border-top:1px solid var(--line)}
.set .it:first-child{border-top:0}
.set .it>b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.set .it>p{margin:0 0 10px;font-size:.86rem;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:.92rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:44px;height:26px;appearance:none;background:var(--line);border-radius:13px;position:relative;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}


/* ---------- fridge illustration ---------- */
.vbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.vbar .seg{flex:none;width:190px}
.vbar .tbtn{margin-left:auto;color:var(--muted);font-weight:500}
.fstage{overflow:hidden;margin:0 -18px;padding:4px 18px 2px}
.fr3d{perspective:1400px;margin:4px 4px 0}
.fbody{position:relative;background:linear-gradient(180deg,#FFFFFF,#F1F4F6);border:1px solid #DCE3E8;border-radius:28px;padding:10px;box-shadow:0 18px 34px -20px rgba(70,90,110,.45),inset 0 1px 0 #fff}
html[data-skin="dark"] .fbody{background:linear-gradient(180deg,#E9EDF0,#D9DFE4);border-color:#AEB8BF}
.feet{display:flex;justify-content:space-between;padding:0 34px}
.feet i{width:26px;height:8px;border-radius:0 0 6px 6px;background:#CBD3D9}
.compt{position:relative;border-radius:18px;transform-style:preserve-3d}
.compt+.compt{margin-top:10px}
.inside{border-radius:18px;padding:12px 10px 8px;position:relative;overflow:hidden}
.freezer .inside{background:linear-gradient(180deg,#DDEFFB,#EEF7FD);box-shadow:inset 0 0 0 1px #C7DDEC,inset 0 8px 16px -10px rgba(80,140,190,.45)}
.freezer .inside::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,255,255,.6) 26px 27px);pointer-events:none}
.cool .inside{background:radial-gradient(130% 55% at 50% 0%,#FFFBEA 0%,#F7FBFD 42%,#EBF3F8 100%);box-shadow:inset 0 0 0 1px #D2E0E8,inset 0 10px 18px -12px rgba(80,120,150,.4)}
.lamp{position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:6px;border-radius:0 0 8px 8px;background:#FFF3C4;box-shadow:0 0 22px 8px rgba(255,232,160,.75);opacity:0;transition:opacity .4s .55s}
.fr3d.open .lamp{opacity:1}
.zl{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:#56707C;font-weight:600;margin:0 4px 6px;position:relative}
.zl span{font-weight:400;color:#86A0AA}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 0 9px;margin-bottom:10px;position:relative;min-height:84px}
.shelf::after{content:"";position:absolute;left:-10px;right:-10px;bottom:0;height:6px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(186,212,226,.75));border-top:1px solid rgba(150,188,208,.85);border-bottom:1px solid rgba(150,188,208,.4)}
.zone:last-child .shelf:last-child{margin-bottom:4px}
.ft{border:0;background:#fff;border-radius:13px;padding:6px 2px 5px;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.04),0 4px 8px -5px rgba(30,70,90,.35);min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;transition:opacity .2s,transform .12s;color:#2F2A23}
.ft:active{transform:scale(.94)}
.ft{position:relative}
.ft .ob{position:absolute;top:3px;right:3px;font-size:.58rem;font-weight:700;line-height:1.5;background:#4A6572;color:#fff;border-radius:6px;padding:0 4px}
.openbox{background:var(--sunk);border-radius:16px;padding:12px 14px;margin-top:12px}
.openbox b{color:var(--ink)}
.openbox .chips{margin-top:8px}
.openbtn{width:100%;margin-top:12px;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px;text-align:left;color:var(--ink);font-weight:600}
.openbtn small{display:block;font-weight:400;color:var(--muted)}
button.pic{border:0;padding:0}
.ft .fe{font-size:1.55rem;line-height:1.15;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;overflow:hidden}
.ft .fe img{width:100%;height:100%;object-fit:cover}
.ft .fn{font-size:.72rem;font-weight:600;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px}
.ft .fd{font-size:.64rem;font-weight:600;padding:0 6px;border-radius:999px;background:#E4F2E7;color:#2E7048}
.ft.soon .fd{background:#FFF0BF;color:#7E5B00}.ft.near .fd{background:#FFE1C6;color:#A34D0B}
.ft.over{box-shadow:0 0 0 2px #E7907F,0 4px 8px -5px rgba(30,70,90,.35)}.ft.over .fd{background:#FBDCD5;color:#AD3421}
.ft.dim{opacity:.22}
.slot{border:1.5px dashed #B9CFDA;background:rgba(255,255,255,.4);border-radius:13px;color:#6E8C96;font-size:.72rem;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:74px}
.slot b{font-size:1.1rem;font-weight:500;line-height:1}
.chill{background:rgba(214,232,242,.55);border-radius:12px;padding:8px 8px 0;margin:0 -2px 10px;box-shadow:inset 0 0 0 1px rgba(160,195,212,.6)}
.chill .shelf::after{display:none}
.chill .shelf{margin-bottom:0}
.rack{margin:0 -2px 10px}
.rack .shelf{padding-bottom:0}
.rack .shelf::after{height:16px;bottom:-2px;left:-2px;right:-2px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,rgba(220,236,245,.55),rgba(196,220,233,.8));border:1px solid rgba(150,188,208,.6);border-top-color:rgba(255,255,255,.9)}
.rack .ft{z-index:0}
.drawers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.drawer{position:relative;border-radius:12px 12px 16px 16px;padding:8px 6px 26px;background:linear-gradient(180deg,rgba(226,243,232,.6),rgba(210,236,219,.8));box-shadow:inset 0 0 0 1px rgba(150,196,168,.6)}
.drawer.fruit{background:linear-gradient(180deg,rgba(252,236,226,.55),rgba(250,224,210,.8));box-shadow:inset 0 0 0 1px rgba(214,170,150,.55)}
.drawer::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;border-radius:0 0 16px 16px;background:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.9);backdrop-filter:blur(1px)}
.drawer::before{content:"";position:absolute;left:35%;right:35%;bottom:8px;height:5px;border-radius:3px;background:rgba(120,150,160,.35);z-index:1}
.drawer .shelf{grid-template-columns:1fr 1fr;padding:0;margin:0;min-height:74px}
.drawer .shelf+.shelf{margin-top:6px}
.drawer .shelf::after{display:none}
.drawer .zl{margin:0 2px 6px}
/* doors */

 background:linear-gradient(125deg,#E6EFF2 0%,#FFFFFF 30%,#DDE8EC 48%,#F6FAFB 62%,#E3EDF0 100%);box-shadow:inset 0 0 0 1px #C7D6DB,inset 0 0 0 6px #F4F8F7,0 2px 6px rgba(40,70,80,.15);

 background:linear-gradient(118deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.75) 36%,rgba(255,255,255,0) 44%,rgba(255,255,255,0) 60%,rgba(255,255,255,.45) 64%,rgba(255,255,255,0) 68%),linear-gradient(180deg,#DDE9EC,#C6D7DC);
 box-shadow:inset 0 0 0 6px #F7FAFB,inset 0 0 0 7px #CBD8DC}
.mcdoor.l{left:0;transform-origin:left center}.mcdoor.r{right:0;transform-origin:right center}
.mcdoor::after{content:"";position:absolute;top:50%;width:8px;height:26px;margin-top:-13px;border-radius:5px;background:linear-gradient(90deg,#B9C7CC,#EEF3F5 55%,#AFBEC4);box-shadow:0 1px 2px rgba(0,0,0,.18)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}

nav.tabs .dot{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--near);color:#fff;font-size:.68rem;line-height:17px;padding:0 5px;font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,30,15,.3);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;max-height:92%;overflow:auto;transform:translateY(105%);transition:transform .22s ease;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}

.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.qty{display:flex;gap:8px}

.qty select{flex:1}
.hint{font-size:.84rem;color:var(--muted);margin-top:6px}
.more{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.more summary{cursor:pointer;color:var(--accent);font-weight:600;padding:8px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
.photo{display:flex;align-items:center;gap:12px}
.photo .pic{width:64px;height:64px}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reasons button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 8px;font-weight:600}
.reasons button span{display:block;font-size:1.4rem}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;gap:4px;align-items:center;z-index:30;transition:.2s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);font-size:.93rem}
.sheet-open .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
.errbar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;background:#FBDCD5;color:#7A2415;border-radius:12px;padding:10px 12px;font-size:.82rem;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.errbar button{border:0;background:#AD3421;color:#fff;border-radius:8px;padding:4px 10px;margin-left:8px;font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{margin-right:6px}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:6px 8px;white-space:nowrap}

@media (prefers-reduced-motion:reduce){.sheet,.toast,.switch input::after{transition:none}}
</style>

<script>

 [/ขนมปัง/,'other',5,'ถุง'],[/ขนม|คุกกี้|ช็อก|เค้ก/,'other',14,'ชิ้น'],

 [/ไข่/,'dairy',21,'ฟอง'],[/นม|โยเกิร์ต|ชีส|เนย|วิปครีม/,'dairy',7,'กล่อง'],

 [/แอปเปิ|กล้วย|ส้ม|องุ่น|สตรอ|แตงโม|มะม่วง|ผลไม้|ฝรั่ง|มะละกอ|สับปะรด|ลำไย|เงาะ|ทุเรียน|กีวี|เบอร์รี/,'fruit',5,'ลูก'],

/* dates */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};

function addU(s,n,u){const d=parse(s);n=Number(n)||0;
  if(u==='day')d.setDate(d.getDate()+n);else if(u==='week')d.setDate(d.getDate()+7*n);
  else if(u==='month')d.setMonth(d.getMonth()+n);else d.setFullYear(d.getFullYear()+n);return fmt(d)}
const thDate=s=>parse(s).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
const thDateY=s=>parse(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});

/* fridge status */

function stOf(n){const A=S.settings.alert;return n<0?'over':n<=A?'near':n<=A+3?'soon':'ok'}
const ST_LABEL={ok:'ปกติ',soon:'ควรใช้เร็วๆ นี้',near:'ใกล้หมดอายุ',over:'หมดอายุแล้ว'};
function daysText(n){return n<0?'เลยมา '+(-n)+' วัน':n===0?'หมดวันนี้':'เหลือ '+n+' วัน'}
function chipFor(n){const s=stOf(n);return `<span class="st ${s}">${s==='ok'?daysText(n):ST_LABEL[s]}</span>`}
const isMeasure=u=>['กรัม','มล.','กก.','ลิตร'].includes(u);
function stepOf(f){if(f.unit==='กรัม'||f.unit==='มล.')return f.init>=500?100:50;if(f.unit==='กก.'||f.unit==='ลิตร')return .25;return 1}

const LS='home-tracker-v1',LSP='home-tracker-photos';
let dbRef=null,phCol=null,saveT=null;
function migrate(d){
  d.fridge=(d.fridge||[]).map(f=>{
    if(typeof f.qty==='number')return f;
    const g=guess(f.name),m=String(f.qty||'').match(/([\d.]+)\s*(.*)/);
    const q=m?parseFloat(m[1]):1,u=m&&m[2]?m[2].trim():g.unit;
    return{id:f.id,name:f.name,qty:q,init:q,unit:u||g.unit,cat:f.cat||g.cat,place:f.place||'fridge',exp:f.exp,bought:f.added||today(),price:0,store:'',note:''};
  });
  d.shop=d.shop||[];d.log=d.log||[];d.settings={...DEF_SET,...(d.settings||{})};
  return migrateItems(d);
}
function loadLocal(){
  try{S=migrate(S)}catch(e){}
  try{const r=localStorage.getItem(LS);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.fridge))S=migrate(d)}}catch(e){}
  try{const p=localStorage.getItem(LSP);if(p)PH=JSON.parse(p)||{}}catch(e){}
}
function save(){
  S.updatedAt=Date.now();if(S.log.length>800)S.log=S.log.slice(-800);
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(dbRef){clearTimeout(saveT);saveT=setTimeout(()=>{dbRef.set(clone(S)).catch(()=>{})},600)}
}
function savePhoto(id,data){
  if(data)PH[id]=data;else delete PH[id];
  try{localStorage.setItem(LSP,JSON.stringify(PH))}catch(e){}
  if(phCol){const r=phCol.doc(id);(data?r.set({d:data}):r.delete()).catch(()=>{})}
}
async function connect(){
  try{
    if(!window.claude||!claude.use)return;
    claude.use('sample').then(s=>{SAMPLE=s||null;if(tab==='menu')render()}).catch(()=>{});
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/home');
    phCol=db.collection('data/users/'+id+'/photos');
    const snap=await ref.get();
    if(snap.exists){const d=snap.data();
      if(d&&Array.isArray(d.fridge)&&(d.updatedAt||0)>(S.updatedAt||0)){S=migrate(clone(d));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}
      dbRef=ref;if((S.updatedAt||0)>(d.updatedAt||0))ref.set(clone(S)).catch(()=>{});
    }else{dbRef=ref;if(S.fridge.length||S.items.length||S.shop.length)ref.set(clone(S)).catch(()=>{})}
    try{const q=await phCol.get();let ch=false;q.docs.forEach(doc=>{const v=doc.data();if(v&&v.d&&!PH[doc.id]){PH[doc.id]=v.d;ch=true}});
      Object.keys(PH).forEach(k=>{if(!q.docs.some(d=>d.id===k))phCol.doc(k).set({d:PH[k]}).catch(()=>{})});
      if(ch){try{localStorage.setItem(LSP,JSON.stringify(PH))}catch(e){}render()}}catch(e){}
  }catch(e){}
}

/* ================= recipe matching ================= */
function stapleHas(label){return S.settings.staples&&S.settings.stapleList.split(/[,\s]+/).some(w=>w&&(w===label||label.includes(w)))}
function matchRecipes(fid){
  const avail=S.fridge.filter(f=>f.qty>0&&left(f)>=0).sort((a,b)=>a.exp.localeCompare(b.exp));
  const find=k=>avail.find(f=>TOK[k][1](f.name,f.cat));
  const out=[];
  for(const r of R){
    const used=[],missing=[],staples=[];
    for(const k of r.need){const f=find(k);if(f){if(!used.includes(f))used.push(f)}else if(TOK[k][2]&&stapleHas(TOK[k][0]))staples.push(TOK[k][0]);else missing.push(k)}
    if(missing.length>1)continue;
    for(const k of r.opt){const f=find(k);if(f&&!used.includes(f))used.push(f)}
    if(!used.length)continue;
    if(fid&&!used.some(f=>f.id===fid))continue;
    const urg=Math.min(...used.map(left));
    out.push({r,used,missing,staples,urg});
  }
  out.sort((a,b)=>a.missing.length-b.missing.length||a.urg-b.urg||b.used.length-a.used.length);
  return out;
}

const cLast=i=>i.hist&&i.hist.length?i.hist[i.hist.length-1]:today();

const WDL=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],WDS=['อา','จ','อ','พ','พฤ','ศ','ส'];
const lastOf=h=>h&&h.length?h[h.length-1]:null;
function schedNext(s,last,start){
  if(s.type==='weekly'&&s.days&&s.days.length){let d=last?addU(last,1,'day'):start;for(let k=0;k<8;k++){if(s.days.includes(parse(d).getDay()))return d;d=addU(d,1,'day')}return d}
  return last?addU(last,s.n,s.unit):start;
}
function schedText(s){return s.type==='weekly'?'ทุกวัน'+[...s.days].sort().map(d=>WDL[d]).join(' '):'ทุก '+s.n+' '+UNITS[s.unit]}
function relDay(n){return n<0?'เลยมา '+(-n)+' วัน':n===0?'วันนี้':n===1?'พรุ่งนี้':'อีก '+n+' วัน'}
const toSched=d=>d>=30&&d%30===0?{type:'every',n:d/30,unit:'month'}:d%7===0?{type:'every',n:d/7,unit:'week'}:{type:'every',n:d,unit:'day'};
function addHist(h,d){return [...new Set([...(h||[]),d])].sort()}
function rateOf(hist,s,start,since){let ok=0,all=0;(hist||[]).forEach((d,k)=>{if(!k||d<since)return;all++;if(d<=schedNext(s,hist[k-1],start))ok++});return[ok,all]}

const PLANT_TPL=[['มอนสเตอร่า',7],['พลูด่าง',5],['ลิ้นมังกร',14],['กวักมรกต',10],['ยางอินเดีย',7],['ไทรใบสัก',5],['ฟิโลเดนดรอน',5],['เฟิร์น',3],['กระบองเพชร',21],['กุหลาบหิน',14],['โกสน',5],['เดหลี',4]];

const aDoneToday=(p,k)=>lastOf(p.acts[k].hist)===today();

function actBtn(p,k,big){const dn=aDoneToday(p,k),n=aLeft(p,k);return `<button class="pw ${dn?'done':n<=0?'hot':''} ${big?'big':''}" data-pact="${p.id}:${k}">${dn?'✓ '+PACTS[k][2]:PACTS[k][0]+' '+PACTS[k][2]}</button>`}

/* ================= care dashboard ================= */
function todayData(){
  const rooms=cleanRooms().filter(r=>tToday(r).length).map(r=>{const l=tToday(r);return{r,list:l,done:l.every(tDoneToday)}});
  const pl=[];S.plants.forEach(p=>Object.keys(PACTS).forEach(k=>{if(pAct(p,k)&&(aLeft(p,k)<=0||aDoneToday(p,k)))pl.push({p,k,done:aDoneToday(p,k)})}));
  const it=S.items.filter(i=>cSt(i)==='due'||lastOf(i.hist)===today()).map(i=>({i,done:lastOf(i.hist)===today()}));
  return{rooms,pl,it};
}
function allHistDates(){const s=new Set();S.clean.forEach(t=>(t.hist||[]).forEach(d=>s.add(d)));S.plants.forEach(p=>Object.values(p.acts).forEach(a=>(a.hist||[]).forEach(d=>s.add(d))));S.items.forEach(i=>(i.hist||[]).slice(1).forEach(d=>s.add(d)));return s}
function streak(){const s=allHistDates();let d=s.has(today())?today():addU(today(),-1,'day'),n=0;while(s.has(d)&&n<999){n++;d=addU(d,-1,'day')}return n}
function weekCount(){const t=parse(today()),mon=fmt(new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7)));let c=0;
  S.clean.forEach(x=>(x.hist||[]).forEach(d=>{if(d>=mon)c++}));S.plants.forEach(p=>Object.values(p.acts).forEach(a=>(a.hist||[]).forEach(d=>{if(d>=mon)c++})));S.items.forEach(i=>(i.hist||[]).slice(1).forEach(d=>{if(d>=mon)c++}));return c}
function upcoming(days){
  const out=[],end=addU(today(),days,'day');
  cleanRooms().forEach(r=>{const nx=roomNext(r);if(nx&&nx.d>today()&&nx.d<=end&&!tToday(r).some(t=>!tDoneToday(t)))out.push({d:nx.d,e:roomEmo(r),l:r,s:nx.tasks.map(t=>t.name).join(', '),a:`data-room="${esc(r)}"`})});
  S.plants.forEach(p=>Object.keys(PACTS).forEach(k=>{if(!pAct(p,k))return;const d=aDue(p,k);if(d>today()&&d<=end)out.push({d,e:PACTS[k][0],l:(k==='water'?'':PACTS[k][1])+(p.nick||p.name),s:p.loc||'',a:`data-pl="${p.id}"`})}));
  S.items.forEach(i=>{const d=cDue(i);if(d>today()&&d<=end)out.push({d,e:i.emoji,l:i.name,s:'เปลี่ยนของใช้',a:`data-ci="${i.id}"`})});
  return out.sort((a,b)=>a.d.localeCompare(b.d));
}

/* ================= combined calendar ================= */
function monthEvents(ym){
  const[y,m]=ym.split('-').map(Number),start=ym+'-01',end=fmt(new Date(y,m,0)),td=today(),ev=[];
  // first = next due date; if it is already past, it stays pinned to today until done
  const project=(first,nextFn,push)=>{const late=first<td?diff(first,td):0;let d=first<td?td:first,k=0,isFirst=true;
    while(d<start&&k++<800){d=nextFn(d);isFirst=false}
    while(d<=end&&k++<900){push(d,isFirst&&d<=td,isFirst?late:0);d=nextFn(d);isFirst=false}};
  const cg={};
  S.clean.forEach(t=>{
    project(tDue(t),d=>schedNext(t.s,d,t.start),(d,now,late)=>{const key=d+'|'+t.room;const g=(cg[key]=cg[key]||{d,room:t.room,tasks:[],t:'plan',late:0});g.tasks.push(t.name);if(now){g.t='due';g.late=Math.max(g.late,late)}})});
  S.clean.forEach(t=>(t.hist||[]).forEach(d=>{if(d<start||d>end)return;const key=d+'|'+t.room+'|done';(cg[key]=cg[key]||{d,room:t.room,tasks:[],t:'done'}).tasks.push(t.name)}));
  Object.values(cg).forEach(g=>{const nx=g.t==='done'&&g.d===td?tasksOf(g.room).map(tDue).filter(x=>x>td).sort()[0]:null;ev.push({d:g.d,kind:'clean',t:g.t,late:g.late||0,nx:nx||null,e:roomEmo(g.room),l:g.room,s:g.tasks.join(', '),a:`data-room="${esc(g.room)}"`})});
  S.plants.forEach(p=>Object.keys(PACTS).forEach(k=>{if(!pAct(p,k))return;const a=p.acts[k],lbl=(k==='water'?'':PACTS[k][1])+(p.nick||p.name);
    project(aDue(p,k),d=>addU(d,a.n,'day'),(d,now,late)=>ev.push({d,kind:'plant',t:now?'due':'plan',late,e:PACTS[k][0],l:lbl,s:PACTS[k][1],a:`data-pl="${p.id}"`}));
    (a.hist||[]).forEach(d=>{if(d>=start&&d<=end)ev.push({d,kind:'plant',t:'done',nx:d===td?aDue(p,k):null,e:PACTS[k][0],l:lbl,s:PACTS[k][2],a:`data-pl="${p.id}"`})})}));
  S.items.forEach(i=>{project(cDue(i),d=>addU(d,i.n,i.unit),(d,now,late)=>ev.push({d,kind:'item',t:now?'due':'plan',late,e:i.emoji,l:i.name,s:'เปลี่ยนของใช้',a:`data-ci="${i.id}"`}));
    (i.hist||[]).slice(1).forEach(d=>{if(d>=start&&d<=end)ev.push({d,kind:'item',t:'done',nx:d===td?cDue(i):null,e:i.emoji,l:i.name,s:'เปลี่ยนแล้ว',a:`data-ci="${i.id}"`})})});
  (S.bills||[]).forEach(b=>{if(b.paused)return;const paid=new Set((b.pays||[]).map(p=>p.period)),nx=bNext(b);
    for(let k=0;k<800;k++){const o=bOcc(b,k);if(o>end||(b.end&&o>b.end))break;if(paid.has(o))continue;
      let dd=o,t='plan',late=0;if(o===nx&&o<=td){t=b.auto?'plan':'due';if(o<td){late=diff(o,td);dd=td}}else if(o<td)continue;
      if(dd<start||dd>end)continue;ev.push({d:dd,kind:'bill',t,late,e:b.emoji,l:b.name,s:(b.var?'~':'')+'฿'+baht2(bAmt(b))+(b.auto?' ตัดอัตโนมัติ':''),a:`data-bi="${b.id}"`})}
    (b.pays||[]).forEach(p=>{if(p.date>=start&&p.date<=end)ev.push({d:p.date,kind:'bill',t:'done',e:b.emoji,l:b.name,s:'฿'+baht2(p.amount),a:`data-bi="${b.id}"`})})});
  (S.meds||[]).forEach(m=>mLots(m).forEach(l=>{if(!l.exp)return;let dd=l.exp,late=0,t='plan';if(l.exp<td){if(ym!==td.slice(0,7))return;late=diff(l.exp,td);dd=td;t='due'}if(dd<start||dd>end)return;
    ev.push({d:dd,kind:'med',t,late,e:mEmo(m),l:m.name+' หมดอายุ',s:t==='due'?'ต้องจัดการ':'ล็อต '+nice(l.qty)+' '+m.unit,a:`data-mi="${m.id}"`})}));

const E_TIERS={'111':[{upTo:15,rate:2.3488},{upTo:25,rate:2.9882},{upTo:200,rate:3.0000},{upTo:400,rate:4.1584},{upTo:null,rate:4.3583}],'112':[{upTo:200,rate:3.0000},{upTo:400,rate:4.1584},{upTo:null,rate:4.3583}]};
const E_SERVICE={'111':8.19,'112':38.22};
function eFresh(type){type=type==='111'?'111':'112';return{setup:false,meterType:type,tiers:clone(E_TIERS[type]),serviceCharge:E_SERVICE[type],ft:0.1623,vat:7,cycleDays:30,cycleStart:today(),startReading:0,readings:[],history:[]}}
function eNorm(e){if(!e||typeof e!=='object')return eFresh();const o={...eFresh(e.meterType),...e};['readings','history'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});if(!Array.isArray(o.tiers)||!o.tiers.length)o.tiers=clone(E_TIERS[o.meterType]);return o}
const E=()=>S.energy;
const money=n=>(isFinite(n)?n:0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>(isFinite(n)?n:0).toLocaleString('th-TH',{maximumFractionDigits:0});
const u1=n=>(isFinite(n)?n:0).toLocaleString('th-TH',{maximumFractionDigits:1});
function eEnergy(units,tiers){let prev=0,sum=0;const rows=[];for(const t of tiers){const cap=t.upTo==null?Infinity:t.upTo,inT=Math.max(0,Math.min(units,cap)-prev),amt=inT*t.rate;rows.push({from:prev,to:cap,units:inT,rate:t.rate,amount:amt,active:inT>0});sum+=amt;prev=cap;if(units<=cap)break}return{sum,rows}}
function eBill(units){const e=E();units=Math.max(0,units||0);const en=eEnergy(units,e.tiers),ft=units*e.ft,base=en.sum+ft+e.serviceCharge,vat=base*e.vat/100;return{units,energy:en.sum,rows:en.rows,ft,service:e.serviceCharge,base,vat,total:base+vat}}
const eReadings=()=>[...E().readings].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function eDerive(){const e=E(),rs=eReadings(),last=rs[rs.length-1];const cur=last?last.reading:e.startReading,cd=last?last.date:e.cycleStart;
  const un=Math.max(0,cur-e.startReading),elapsed=Math.max(0,diff(e.cycleStart,cd));
  return{un,elapsed,proj:last&&elapsed>=2&&un>0?un/elapsed*e.cycleDays:null,cur,cd,has:!!last,dayNow:Math.max(0,diff(e.cycleStart,today()))}}
function ePoints(start,sr,readings){const pts=[{day:0,units:0}];[...readings].sort((a,b)=>a.date<b.date?-1:1).forEach(r=>pts.push({day:diff(start,r.date),units:Math.max(0,r.reading-sr)}));return pts}
function eAt(pts,day){if(day<=pts[0].day)return pts[0].units;for(let k=1;k<pts.length;k++){if(day<=pts[k].day){const a=pts[k-1],b=pts[k];return b.day===a.day?b.units:a.units+(b.units-a.units)*(day-a.day)/(b.day-a.day)}}return null}
function ePrev(){const h=E().history;for(let k=h.length-1;k>=0;k--)if(h[k].units>0)return h[k];return null}
function ePrevPts(p){return p.readings&&p.readings.length?ePoints(p.start,p.startReading,p.readings):[{day:0,units:0},{day:Math.max(1,diff(p.start,p.end)),units:p.units}]}
function ePrevAt(p,day){const v=eAt(ePrevPts(p),day);return v==null?p.units:v}
const E_MOUTH={happy:'M47 60 Q60 75 73 60',neutral:'M51 64 Q60 69 69 64',worried:'M49 68 Q60 60 71 68'};
function eMascot(mood,size){const ey=mood==='worried'?48:50,glow=mood==='happy'?'#77c247':mood==='worried'?'#e77a2a':'#eaa41c';
  return `<svg class="nongfai" viewBox="0 0 120 120" width="${size}" height="${size}" aria-hidden="true"><circle cx="60" cy="54" r="42" fill="${glow}" opacity=".22"/><rect x="49" y="82" width="22" height="9" rx="3" fill="#c9a24a"/><rect x="51" y="90" width="18" height="6" rx="3" fill="#b08633"/><rect x="53" y="96" width="14" height="5" rx="2.5" fill="#8f6a26"/><circle cx="60" cy="52" r="33" fill="#ffe08a" stroke="#eaa41c" stroke-width="3"/><ellipse cx="48" cy="40" rx="7" ry="10" fill="#fff6d8" opacity=".7"/><circle cx="42" cy="60" r="5" fill="#f4a173" opacity=".5"/><circle cx="78" cy="60" r="5" fill="#f4a173" opacity=".5"/><circle cx="50" cy="${ey}" r="4.5" fill="#5a3d16"/><circle cx="70" cy="${ey}" r="4.5" fill="#5a3d16"/><path d="${E_MOUTH[mood]}" fill="none" stroke="#5a3d16" stroke-width="3.2" stroke-linecap="round"/></svg>`}
function eInsight(d){
  if(!d.has)return{mood:'neutral',txt:'มาจดเลขมิเตอร์กันเถอะ เดี๋ยวน้องไฟคำนวณค่าไฟให้'};
  const e=E(),pts=ePoints(e.cycleStart,e.startReading,e.readings),L=d.elapsed;
  const mood=d.proj==null?'happy':d.proj>400?'worried':d.proj>250?'neutral':'happy';let txt='';
  if(L>=14){const a=(eAt(pts,L)-eAt(pts,L-7))/7,b=(eAt(pts,L-7)-eAt(pts,L-14))/7,ch=b>0?(a-b)/b*100:0;
    txt=`ช่วง 7 วันที่ผ่านมาใช้ไฟเฉลี่ย ${u1(a)} หน่วย/วัน `+(Math.abs(ch)<8?'ใกล้เคียงกับสัปดาห์ก่อน':ch>0?`มากกว่าสัปดาห์ก่อน ${m0(ch)}%`:`น้อยกว่าสัปดาห์ก่อน ${m0(-ch)}%`)}
  const p=ePrev();
  if(!txt&&p&&L>=2){const pu=ePrevAt(p,L);if(pu>0){const ch=(d.un-pu)/pu*100;txt=Math.abs(ch)<5?'รอบนี้ใช้ไฟใกล้เคียงกับรอบก่อน':`รอบนี้ใช้ไฟ${ch>0?'มากกว่า':'น้อยกว่า'}รอบก่อนประมาณ ${m0(Math.abs(ch))}%`}}
  if(!txt&&L>=7){txt=`ช่วง 7 วันที่ผ่านมาใช้ไฟเฉลี่ย ${u1((eAt(pts,L)-eAt(pts,L-7))/7)} หน่วย/วัน`}
  if(!txt)txt=d.proj==null?'บันทึกแล้ว อีก 2 ถึง 3 วันมาจดอีกที เดี๋ยวน้องไฟคาดการณ์ค่าทั้งเดือนให้':d.proj>400?'รอบนี้อาจใช้เกิน 400 หน่วย ลองตั้งแอร์ 26 องศาแล้วเปิดพัดลมช่วย':d.proj>250?'กำลังพอดีๆ ระวังอย่าให้พุ่งเกินนี้':'ใช้ไฟประหยัดมาก ทำต่อไปนะ';

}

function eChart(){
  const e=E(),d=eDerive(),N=e.cycleDays,pts=ePoints(e.cycleStart,e.startReading,e.readings).filter(p=>p.day<=N),p=ePrev(),pp=p?ePrevPts(p).filter(x=>x.day<=N):null;
  const mx=Math.max(1,d.proj||0,d.un,pp?Math.max(...pp.map(x=>x.units)):0)*1.08;
  const W=330,H=160,L=38,R=10,T=10,B=26,x=v=>L+(W-L-R)*Math.min(v,N)/N,y=v=>T+(H-T-B)*(1-v/mx);
  const line=a=>a.map((q,k)=>(k?'L':'M')+x(q.day).toFixed(1)+' '+y(q.units).toFixed(1)).join('');
  const last=pts[pts.length-1],ticks=[0,mx/2,mx].map(v=>Math.round(v));
  return `<svg class="echart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟหน่วยไฟสะสมตามวัน">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${m0(v)}</text>`).join('')}
   ${[0,Math.round(N/2),N].map(v=>`<text x="${x(v)}" y="${H-8}" text-anchor="middle">${v?'วันที่ '+v:'เริ่ม'}</text>`).join('')}
   ${pp?`<path d="${line(pp)}" fill="none" style="stroke:var(--muted);opacity:.55" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>`:''}
   ${d.proj!=null&&last.day<N?`<path d="M${x(last.day)} ${y(last.units)} L${x(N)} ${y(d.proj)}" fill="none" style="stroke:var(--accent);opacity:.5" stroke-width="2" stroke-dasharray="6 5"/>`:''}
   <path d="${line(pts)}" fill="none" style="stroke:var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.slice(1).map(q=>`<circle cx="${x(q.day)}" cy="${y(q.units)}" r="3.5" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2"/>`).join('')}
  </svg><div class="legend" style="justify-content:flex-start"><span><i style="background:var(--accent)"></i>รอบนี้</span>${d.proj!=null?'<span><i style="background:var(--accent);opacity:.5"></i>คาดการณ์</span>':''}${pp?'<span><i style="background:var(--muted);opacity:.55"></i>รอบก่อน</span>':''}</div>`;
}

  openSheet(`<h3>เริ่มรอบบิลใหม่</h3><p class="lead">ใช้เมื่อขึ้นบิลรอบใหม่แล้ว ยอดรอบนี้ (${u1(d.un)} หน่วย) จะเก็บไว้ในประวัติ แล้วเริ่มนับใหม่</p>
  <div class="field"><label for="ncVal">เลขมิเตอร์ตั้งต้นรอบใหม่</label><input class="inp bignum" type="number" inputmode="decimal" id="ncVal" value="${d.cur}"></div>
  <div class="field"><label for="ncDate">วันเริ่มรอบใหม่</label><input class="inp" type="date" id="ncDate" value="${today()}"></div>
  <div class="btns"><button class="btn primary" id="ncGo">เริ่มรอบใหม่</button></div>`);
  $('#ncGo').onclick=()=>{const v=parseFloat($('#ncVal').value);if(!isFinite(v)){$('#ncVal').focus();return}snap();
    if(d.has&&d.un>0)e.history.push({start:e.cycleStart,end:d.cd,units:d.un,total:eBill(d.un).total,startReading:e.startReading,readings:clone(e.readings)});
    e.startReading=v;e.cycleStart=$('#ncDate').value||today();e.readings=[];save();closeSheet();render();toast('เริ่มรอบบิลใหม่แล้ว',{undo:true})};
}
const APPL=[['📺','ทีวี',100,5],['🧊','ตู้เย็น',150,10],['💻','คอมพิวเตอร์',200,6],['🚿','เครื่องทำน้ำอุ่น',3500,.5],['🌀','พัดลม',50,8],['🍚','หม้อหุงข้าว',700,1],['👕','เตารีด',1000,.5],['🧺','เครื่องซักผ้า',500,1]];
function eMarginal(){const e=E(),top=e.tiers[e.tiers.length-1].rate;return(top+e.ft)*(1+e.vat/100)}

function wireETools(){
  const g=id=>document.getElementById(id);if(!g('tqGo'))return;
  g('tqGo').onclick=()=>{const u=parseFloat(g('tqU').value);if(!isFinite(u)){g('tqR').innerHTML='<span style="color:var(--over)">ใส่จำนวนหน่วยก่อน</span>';return}g('tqR').innerHTML=`ใช้ ${u1(u)} หน่วย ≈ <b>฿${money(eBill(u).total)}</b>`};
  g('acGo').onclick=()=>{const btu=parseFloat(g('acBtu').value),hr=parseFloat(g('acHr').value),inv=g('acType').value==='inv';
    if(!(btu>0&&hr>0)){g('acR').innerHTML='<span style="color:var(--over)">ใส่ขนาดแอร์และชั่วโมงก่อน</span>';return}
    const kwh=(btu/(inv?12.5:10.5))/1000*(inv?.62:.75),day=kwh*hr,mon=day*30,cu=eMarginal();
    g('acR').innerHTML=`≈ <b>${u1(day)}</b> หน่วย/วัน, <b>${m0(mon)}</b> หน่วย/เดือน<br>คิดเป็นเงินราว <b>฿${money(mon*cu)}</b>/เดือน<br><span class="hint">ตั้ง 26 องศาแล้วเปิดพัดลมช่วย และล้างแอร์สม่ำเสมอ ช่วยลดได้ราว 20 ถึง 30%</span>`};
  document.querySelectorAll('[data-appl]').forEach(b=>b.onclick=()=>{const a=APPL[b.dataset.appl];g('apW').value=a[2];g('apH').value=a[3];g('apGo').click()});
  g('apGo').onclick=()=>{const w=parseFloat(g('apW').value),hr=parseFloat(g('apH').value);if(!(w>0&&hr>0)){g('apR').innerHTML='<span style="color:var(--over)">ใส่กำลังไฟและชั่วโมงก่อน</span>';return}
    const mon=w/1000*hr*30;g('apR').innerHTML=`${m0(w)} วัตต์ ใช้ ${u1(hr)} ชั่วโมง/วัน ≈ <b>${u1(mon)}</b> หน่วย/เดือน, ราว <b>฿${money(mon*eMarginal())}</b>/เดือน`};
}

/* ================= stock (สต็อกบ้าน) ================= */
const SGROUP={use:['ของใช้','🧴'],kitchen:['ของครัว','🥫']};
const SSUB={use:['ห้องน้ำและร่างกาย','ซักผ้า','ทำความสะอาด','กระดาษและถุง','ยาและปฐมพยาบาล','อะไหล่และไส้กรอง'],kitchen:['เครื่องปรุง','ของแห้ง','เครื่องดื่ม','ขนมและของว่าง','อาหารกระป๋อง']};
const SLEVEL={full:['เต็ม','ok'],ok:['พอใช้','ok'],low:['ใกล้หมด','soon'],out:['หมด','over']};
const SUNITS=['ชิ้น','ขวด','หลอด','ก้อน','ม้วน','แพ็ก','ถุง','กล่อง','ซอง','กระป๋อง','กก.','ลิตร'];
// [name, emoji, group, sub, unit, mode, low]
const STPL=[
 ['กระดาษทิชชู','🧻','use','กระดาษและถุง','ม้วน','qty',4],['ยาสีฟัน','🪥','use','ห้องน้ำและร่างกาย','หลอด','qty',1],['สบู่','🧼','use','ห้องน้ำและร่างกาย','ก้อน','qty',1],['แชมพู','🧴','use','ห้องน้ำและร่างกาย','ขวด','qty',1],['สบู่เหลว','🧴','use','ห้องน้ำและร่างกาย','ขวด','qty',1],
 ['น้ำยาซักผ้า','🧺','use','ซักผ้า','ขวด','level',0],['น้ำยาปรับผ้านุ่ม','🧺','use','ซักผ้า','ขวด','level',0],['น้ำยาล้างจาน','🧽','use','ทำความสะอาด','ขวด','level',0],['น้ำยาถูพื้น','🪣','use','ทำความสะอาด','ขวด','level',0],['ถุงขยะ','🗑️','use','กระดาษและถุง','แพ็ก','qty',1],
 ['ไส้กรองน้ำ','💧','use','อะไหล่และไส้กรอง','ชิ้น','qty',0],['ถ่าน AA','🔋','use','อะไหล่และไส้กรอง','ก้อน','qty',2],['พลาสเตอร์ยา','🩹','use','ยาและปฐมพยาบาล','กล่อง','qty',0],
 ['น้ำปลา','🫙','kitchen','เครื่องปรุง','ขวด','qty',0],['ซีอิ๊วขาว','🫙','kitchen','เครื่องปรุง','ขวด','qty',0],['ซอสหอยนางรม','🫙','kitchen','เครื่องปรุง','ขวด','qty',0],['ซอสมะเขือเทศ','🍅','kitchen','เครื่องปรุง','ขวด','qty',0],['น้ำมันพืช','🫗','kitchen','เครื่องปรุง','ขวด','qty',0],
 ['น้ำตาล','🍬','kitchen','เครื่องปรุง','ถุง','level',0],['เกลือ','🧂','kitchen','เครื่องปรุง','ถุง','level',0],['กาแฟ','☕','kitchen','เครื่องดื่ม','ถุง','level',0],['บะหมี่กึ่งสำเร็จรูป','🍜','kitchen','ของแห้ง','ซอง','qty',5],['ข้าวสาร','🍚','kitchen','ของแห้ง','ถุง','qty',1],['ปลากระป๋อง','🥫','kitchen','อาหารกระป๋อง','กระป๋อง','qty',2],['นมกล่อง UHT','🥛','kitchen','เครื่องดื่ม','กล่อง','qty',2]];
const USE_RX=/ทิชชู|กระดาษ|สบู่|แชมพู|ครีมนวด|ยาสีฟัน|แปรง|น้ำยา|ผงซักฟอก|ถุงขยะ|ไส้กรอง|ถ่าน|ฟองน้ำ|สำลี|ผ้าอนามัย|โฟม|โรลออน|พลาสเตอร์|ยา(?!ง)|หลอดไฟ|มีดโกน|ทรายแมว/;
let sfilter='all',squery='';
const stplOf=n=>STPL.find(t=>t[0]===n)||STPL.find(t=>n.includes(t[0])||t[0].includes(n)&&n.length>2);
function sEmo(x){const t=stplOf(x.name);return x.emoji||(t?t[1]:emo(x.name,x.group==='use'?'other':'other'))||SGROUP[x.group][1]}
function sState(x){if(x.mode==='level')return x.level==='out'?'out':x.level==='low'?'low':'ok';return x.qty<=0?'out':x.qty<=(x.low||0)?'low':'ok'}
function sAmount(x){return x.mode==='level'?SLEVEL[x.level||'ok'][0]:nice(x.qty)+' '+x.unit}
function sExpSoon(x){return x.hasExp&&x.exp?diff(today(),x.exp):null}
function stockFor(name){return S.stock.find(x=>x.name===name)||S.stock.find(x=>x.name.includes(name)||name.includes(x.name))}
function groupOf(name,cat){const t=stplOf(name);if(t)return t[2]==='use'?'use':'food';if(S.stock.some(x=>x.name===name&&x.group==='use'))return 'use';if(USE_RX.test(name))return 'use';return 'food'}
function sRow(x){
  const st=sState(x),n=sExpSoon(x),ins=inShop(x.name);
  const meta=[x.sub,x.loc,n!=null?(n<0?'หมดอายุแล้ว':'หมดอายุ '+thDate(x.exp)):''].filter(Boolean).join(', ');
  let right;
  if(st!=='ok')right=ins?'<span class="st low">ในรายการซื้อ</span>':`<button class="cdone" data-sbuy="${x.id}">+ ซื้อ</button>`;
  else right=x.mode==='qty'?`<div class="step"><button data-sdec="${x.id}" aria-label="ใช้ไป 1">−</button><span>${nice(x.qty)}</span><button data-sinc="${x.id}" aria-label="เพิ่ม 1">+</button></div>`:`<button class="lvl ${SLEVEL[x.level||'ok'][1]}" data-slvl="${x.id}">${SLEVEL[x.level||'ok'][0]}</button>`;
  return `<div class="srow2 ${st}"><span class="em">${sEmo(x)}</span><button class="nm" data-si="${x.id}">${esc(x.name)}<small><b class="sa ${st}">${st==='out'?'หมดแล้ว':st==='low'?'เหลือ '+sAmount(x)+(x.mode==='level'?'':' (ใกล้หมด)'):sAmount(x)}</b>${meta?', '+esc(meta):''}</small></button>${right}</div>`;
}
function viewStock(){
  const all=S.stock,out=all.filter(x=>sState(x)==='out').length,low=all.filter(x=>sState(x)==='low').length;
  let h=`<div class="summary"><button data-sf="need"><span class="num" style="color:var(--over)">${out}</span><span>🔴 หมดแล้ว</span></button><button data-sf="need"><span class="num" style="color:var(--soon)">${low}</span><span>🟡 ใกล้หมด</span></button><button data-tab="sshop"><span class="num">${S.shop.length}</span><span>🛒 ในรายการซื้อ</span></button></div>`;
  if(!all.length)return h+`<div class="card empty"><span class="big">📦</span><p>เพิ่มของสำรองในบ้าน เช่น ทิชชู ยาสีฟัน น้ำปลา ข้าวสาร แอพจะบอกว่าอะไรใกล้หมดและต้องซื้อ</p><button class="btn primary" data-sadd>+ เพิ่มสต็อก</button></div>`;
  h+=`<div class="search">${IC.search}<input id="sq" type="search" placeholder="ค้นหาของ" value="${esc(squery)}" autocomplete="off"></div>
   <div class="chips filters">${[['all','ทั้งหมด'],['use','🧴 ของใช้'],['kitchen','🥫 ของครัว']].map(([k,l])=>`<button class="chip ${sfilter===k?'on':''}" data-sfil="${k}">${l}<small>${k==='all'?all.length:all.filter(x=>x.group===k).length}</small></button>`).join('')}</div><div id="sRest">${stockRest()}</div>`;
  return h;
}
function stockRest(){
  const q=squery.trim();let list=S.stock.filter(x=>(sfilter==='all'||x.group===sfilter)&&(!q||x.name.includes(q)));
  if(!list.length)return `<div class="card empty"><p>${q?'ไม่พบ "'+esc(q)+'"':'ยังไม่มีของในหมวดนี้'}</p>${q?`<button class="btn" data-sadd-name="${esc(q)}">+ เพิ่ม ${esc(q)}</button>`:''}</div>`;
  const need=list.filter(x=>sState(x)!=='ok').sort((a,b)=>(sState(a)==='out'?0:1)-(sState(b)==='out'?0:1)),expSoon=x=>{const n=sExpSoon(x);return n!=null&&n<=30},ok=list.filter(x=>sState(x)==='ok'&&!expSoon(x)).sort((a,b)=>a.name.localeCompare(b.name,'th'));
  const exp=list.filter(x=>sState(x)==='ok'&&expSoon(x)).sort((a,b)=>a.exp.localeCompare(b.exp));
  let h='';
  if(need.length)h+=`<h2 class="sec">ต้องซื้อ<small>${need.length} รายการ${need.some(x=>!inShop(x.name))?` <button class="tbtn go" data-sbuyall style="padding:0;min-height:0">ใส่รายการซื้อทั้งหมด</button>`:''}</small></h2><div class="card list">${need.map(sRow).join('')}</div>`;
  if(exp.length)h+=`<h2 class="sec">ใกล้หมดอายุ<small>ภายใน 30 วัน</small></h2><div class="card list">${exp.map(sRow).join('')}</div>`;
  if(ok.length)h+=`<h2 class="sec">สต็อกปกติ<small>${ok.length} รายการ</small></h2><div class="card list">${ok.map(sRow).join('')}</div>`;
  return h;
}
function sAddToShop(x,silent){if(inShop(x.name)){if(!silent)toast(x.name+'อยู่ในรายการซื้อแล้ว');return false}
  const n=x.mode==='qty'?Math.max(1,(x.low||0)+1-Math.max(0,x.qty)):1;
  S.shop.push({id:uid(),name:x.name,cat:guess(x.name).cat,group:x.group==='use'?'use':'food',src:'stock',ref:x.id,n,qty:x.mode==='qty'?n+' '+x.unit:''});save();return true}
function stockSheet(x){
  const st=sState(x),n=sExpSoon(x),rep=S.items.filter(i=>i.name===x.name||i.name.includes(x.name)||x.name.includes(i.name));
  openSheet(`<div style="display:flex;gap:14px;align-items:center"><div class="pic" style="width:56px;height:56px">${sEmo(x)}</div><div style="min-width:0"><h3 style="margin:0">${esc(x.name)}</h3><div class="hint" style="margin:0">${SGROUP[x.group][1]} ${SGROUP[x.group][0]}${x.sub?', '+esc(x.sub):''}${x.loc?', '+esc(x.loc):''}</div></div></div>
  ${x.mode==='qty'?`<div class="bigstep"><button id="sDec" aria-label="ใช้ไป 1">−</button><span>เหลือ ${nice(x.qty)} ${esc(x.unit)}</span><button id="sInc" aria-label="เพิ่ม 1">+</button></div><p class="hint" style="text-align:center;margin:0">แจ้งเตือนเมื่อเหลือไม่เกิน ${x.low||0} ${esc(x.unit)}</p>`
   :`<div class="seg" id="sLv" style="margin-top:14px">${Object.entries(SLEVEL).map(([k,v])=>`<button class="${(x.level||'ok')===k?'on':''}" data-v="${k}">${v[0]}</button>`).join('')}</div>`}
  ${n!=null?`<p class="hint">${n<0?'⚠️ หมดอายุแล้วเมื่อ ':'หมดอายุ '}${thFull(x.exp)}</p>`:''}
  ${rep.length?`<div class="openbox"><b>🔄 ใช้กับรอบเปลี่ยน${esc(rep[0].name)}</b><div class="hint" style="margin:2px 0 0">ถึงรอบ${relDay(cLeft(rep[0]))} กดเปลี่ยนแล้วในรอบเปลี่ยนของใช้ ของสำรองจะลดลงเอง</div></div>`:''}
  <div class="btns">${st!=='ok'||!inShop(x.name)?`<button class="btn primary" id="sBuy" ${inShop(x.name)?'disabled':''}>${inShop(x.name)?'อยู่ในรายการซื้อแล้ว':'🛒 ใส่รายการซื้อ'}</button>`:''}${x.group==='kitchen'&&x.mode==='qty'&&x.qty>0?'<button class="btn" id="sOpen">🥄 เปิดใช้ 1 '+esc(x.unit)+'</button>':''}</div>
  <div class="btns"><button class="btn" id="sEdit">แก้ไข</button><button class="btn danger" id="sDel">ลบ</button></div>`);
  const re=()=>{render();stockSheet(x)};
  if($('#sDec'))$('#sDec').onclick=()=>{sStep(x,-1);re()};
  if($('#sInc'))$('#sInc').onclick=()=>{sStep(x,1);re()};
  if($('#sLv'))$('#sLv').onclick=e=>{const b=e.target.closest('button');if(!b)return;sSetLevel(x,b.dataset.v);re()};
  if($('#sBuy'))$('#sBuy').onclick=()=>{if(sAddToShop(x)){toast('ใส่'+x.name+'ในรายการซื้อแล้ว');re()}};
  if($('#sOpen'))$('#sOpen').onclick=()=>{snap();x.qty=Math.max(0,x.qty-1);const g=guess(x.name),f={id:uid(),name:x.name,qty:1,init:1,unit:x.unit,cat:g.cat,place:'fridge',bought:today(),price:0,store:'',note:'',opened:today()};
    f.origExp=x.hasExp&&x.exp?x.exp:addU(today(),365,'day');f.exp=minDate(f.origExp,addU(today(),openLife(f),'day'));S.fridge.push(f);save();closeSheet();render();
    toast('เปิดใช้'+x.name+'แล้ว ย้ายเข้าตู้เย็น ควรใช้ให้หมดภายใน '+thDate(f.exp),{undo:true})};
  $('#sEdit').onclick=()=>stockForm(x);
  $('#sDel').onclick=()=>{snap();S.stock=S.stock.filter(y=>y.id!==x.id);save();closeSheet();render();toast('ลบ'+x.name+'แล้ว',{undo:true})};
}
function sStep(x,d){const was=sState(x);x.qty=Math.max(0,nice(x.qty+d));save();const now=sState(x);
  if(d<0&&was==='ok'&&now!=='ok'&&!inShop(x.name))toast(x.name+(now==='out'?'หมดแล้ว':'ใกล้หมดแล้ว'),{act:['ใส่รายการซื้อ',()=>{sAddToShop(x);render()}]})}
function sSetLevel(x,l){const was=sState(x);x.level=l;save();if(was==='ok'&&sState(x)!=='ok'&&!inShop(x.name))toast(x.name+SLEVEL[l][0],{act:['ใส่รายการซื้อ',()=>{sAddToShop(x);render()}]})}

  <div class="field"><span class="lbl">อยู่ที่</span>${chipGroup('kLoc',locs.map(l=>[l,l]),x.loc,'เพิ่มที่เก็บ')}</div>
  <div class="field"><span class="lbl">วิธีติดตาม</span><div class="seg" id="kMode"><button type="button" class="${x.mode==='qty'?'on':''}" data-v="qty">นับจำนวน</button><button type="button" class="${x.mode==='level'?'on':''}" data-v="level">บอกสถานะ</button></div>
   <p class="hint">ของที่นับยาก เช่น ซอสขวดที่เปิดแล้ว ใช้แบบบอกสถานะ แค่กดว่าเต็ม พอใช้ ใกล้หมด หรือหมด</p></div>
  <div id="kQty" ${x.mode==='qty'?'':'hidden'}>

   <div class="field"><label for="kLow">แจ้งเตือนเมื่อเหลือไม่เกิน</label><div class="two"><input class="inp" type="number" min="0" id="kLow" value="${x.low||0}" style="max-width:110px"><span class="hint" id="kLowU" style="align-self:center;margin:0">${esc(x.unit)}</span></div></div></div>

  wireSub();wireChips('kLoc',v=>{});

    $('#kSubWrap').innerHTML=chipGroup('kSub',subs(b.dataset.v).map(s=>[s,s]),'','สร้างหมวดเอง');wireSub();drawTpl()};
  $('#kMode').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#kMode').querySelectorAll('button').forEach(y=>y.classList.toggle('on',y===b));$('#kQty').hidden=b.dataset.v!=='qty';$('#kLvl').hidden=b.dataset.v!=='level'};

      level:($('#kLevel .on')||{dataset:{v:'full'}}).dataset.v,hasExp,exp:hasExp?$('#kExp').value:'',note:$('#kNote').value.trim()};

/* replacement item <-> stock spare */
const isService=n=>/^ล้าง|^ซัก/.test(n);
function spareOf(i){return isService(i.name)?null:S.stock.find(x=>x.name===i.name)||S.stock.find(x=>x.name.includes(i.name)||i.name.includes(x.name))}
function spareCount(i){const x=spareOf(i);if(!x)return 0;return x.mode==='qty'?x.qty:(x.level==='out'?0:1)}
function needSpare(i){return !isService(i.name)&&cSt(i)!=='ok'&&spareCount(i)<=0}
function itemBuy(i){if(inShop(i.name)){toast(i.name+'อยู่ในรายการซื้อแล้ว');return}
  S.shop.push({id:uid(),name:i.name,cat:'other',group:'use',src:'item',ref:i.id,n:1,qty:'1 ชิ้น'});save();render();toast('ใส่'+i.name+'ในรายการซื้อแล้ว')}

/* ================= central shopping list ================= */
const SRC_TAG={fridge:'🧊 ตู้เย็น',stock:'📦 สต็อก',item:'🔄 ถึงรอบเปลี่ยน',med:'💊 ตู้ยา'};
function shopGroup(s){return s.src==='med'?'med':s.group||groupOf(s.name,s.cat)}
function viewShop(){
  let h=`<div class="addline"><input id="shopIn" placeholder="เพิ่มของที่ต้องซื้อ เช่น ไข่ไก่ 10 ฟอง" autocomplete="off"><button class="btn primary" data-shop-add>เพิ่ม</button></div>`;
  const lows=S.fridge.filter(f=>isLow(f)&&!inShop(f.name)),sneed=S.stock.filter(x=>sState(x)!=='ok'&&!inShop(x.name)),ineed=S.items.filter(i=>needSpare(i)&&!inShop(i.name));
  const inFridge=new Set(S.fridge.filter(f=>!isLow(f)).map(f=>f.name));
  const freq={};S.log.filter(l=>l.t==='buy').forEach(l=>freq[l.name]=(freq[l.name]||0)+1);
  const often=Object.entries(freq).filter(([n,c])=>c>=2&&!inShop(n)&&!inFridge.has(n)&&!lows.some(f=>f.name===n)).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const sug=[...lows.map(f=>`<button class="chip" data-buy="${f.id}">+ ${emo(f.name,f.cat)} ${esc(f.name)}</button>`),...sneed.map(x=>`<button class="chip" data-sbuy="${x.id}">+ ${sEmo(x)} ${esc(x.name)}</button>`),...ineed.map(i=>`<button class="chip" data-ibuy="${i.id}">+ ${i.emoji} ${esc(i.name)}</button>`),...S.meds.filter(m=>(mFlags(m).low||mFlags(m).expired)&&!inShop(m.name)).map(m=>`<button class="chip" data-mbuy="${m.id}">+ ${mEmo(m)} ${esc(m.name)}</button>`)];
  if(sug.length)h+=`<h2 class="sec">ใกล้หมดหรือถึงรอบ<small>แตะเพื่อเพิ่ม</small></h2><div class="chips" style="margin-bottom:6px">${sug.join('')}</div>`;
  if(often.length)h+=`<h2 class="sec">ซื้อบ่อย</h2><div class="chips" style="margin-bottom:6px">${often.map(([n])=>`<button class="chip" data-shop-name="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>`;
  if(!S.shop.length)return h+`<div class="card empty" style="margin-top:18px"><span class="big">🛒</span><p>ยังไม่มีของต้องซื้อ ของที่ใกล้หมดในตู้เย็นและสต็อก หรือของใช้ที่ถึงรอบแต่ไม่มีสำรอง จะขึ้นให้แตะเพิ่มด้านบน</p></div>`;
  for(const[g,l]of[['food','🥫 ของกิน'],['med','💊 ตู้ยา'],['use','🧴 ของใช้']]){
    const items=S.shop.filter(s=>shopGroup(s)===g);if(!items.length)continue;
    h+=`<h2 class="sec">${l}<small>${items.length}</small></h2><div class="card list">${items.map(s=>`<div class="srow"><button class="tick" data-bought="${s.id}" aria-label="ซื้อ${esc(s.name)}แล้ว">✓</button><span class="em">${s.src==='stock'?sEmo(S.stock.find(x=>x.id===s.ref)||{name:s.name,group:'kitchen'}):s.src==='med'?mEmo(S.meds.find(x=>x.id===s.ref)||{name:s.name,cat:'common'}):s.src==='item'?(S.items.find(i=>i.id===s.ref)||{}).emoji||'🔄':(stplOf(s.name)||[0,emo(s.name,s.cat)])[1]}</span><div class="nm">${esc(s.name)}${s.qty||s.src?`<small>${s.qty?esc(s.qty):''}${s.qty&&SRC_TAG[s.src]?', ':''}${SRC_TAG[s.src]?'จาก '+SRC_TAG[s.src]:''}</small>`:''}</div><button class="x" data-shop-del="${s.id}" aria-label="ลบ${esc(s.name)}">×</button></div>`).join('')}</div>`;
  }
  h+=`<button class="btn primary block" data-buyall style="margin-top:16px">✓ ซื้อครบแล้ว</button>`;
  return h;
}
function addShop(o){if(inShop(o.name)){toast(o.name+'อยู่ในรายการซื้อแล้ว');return false}
  const g=guess(o.name),st=stockFor(o.name);
  S.shop.push({id:uid(),name:o.name,cat:o.cat||g.cat,qty:o.qty||'',group:o.group||(st?(st.group==='use'?'use':'food'):groupOf(o.name,o.cat)),src:o.src||(st?'stock':''),ref:o.ref||(st?st.id:''),n:o.n||parseFloat(o.qty)||1});save();return true}
function restockTarget(s){if(s.src==='med')return null;if(s.src==='stock')return S.stock.find(x=>x.id===s.ref)||stockFor(s.name);if(s.src==='item')return stockFor(s.name)||null;if(s.src==='fridge')return null;return stockFor(s.name)}

  if(s.src==='med'){const m=S.meds.find(x=>x.id===s.ref)||S.meds.find(x=>x.name===s.name);if(m)return medBoughtSheet(s,m);return medForm(null,{name:s.name,shopId:s.id})}
  const tgt=restockTarget(s);
  if(s.src==='item'||tgt||shopGroup(s)==='use')return stockBoughtSheet(s,tgt);
  const g=guess(s.name),m=String(s.qty).match(/([\d.]+)\s*(.*)/),q=m?parseFloat(m[1]):1,u=m&&m[2]?m[2].trim():g.unit,exp=addU(today(),g.days,'day');

  <div class="card pad" style="box-shadow:none;background:var(--sunk);display:flex;gap:12px;align-items:center"><span style="font-size:1.8rem">${emo(s.name,s.cat)}</span><div><b style="color:var(--ink)">${esc(s.name)} ${nice(q)} ${esc(u)}</b><div style="font-size:.88rem;color:var(--muted)">ถ้าเข้าตู้เย็น หมดอายุประมาณ ${thDate(exp)}</div></div></div>
  <div class="btns"><button class="btn primary" id="bAdd">🧊 เข้าตู้เย็น</button><button class="btn" id="bStock">📦 เข้าสต็อก</button></div>
  <button class="btn block" id="bEdit" style="margin-top:8px">แก้รายละเอียดก่อนเข้าตู้เย็น</button>
  <button class="btn block" id="bSkip" style="margin-top:8px;background:none;color:var(--muted)">ไม่ต้อง แค่ขีดออกจากรายการ</button>`);
  $('#bAdd').onclick=()=>{snap();S.shop=S.shop.filter(x=>x.id!==s.id);S.fridge.push({id:uid(),name:s.name,qty:q,init:q,unit:u,cat:s.cat,exp,place:'fridge',bought:today(),price:0,store:'',note:''});
    S.log.push({t:'buy',name:s.name,cat:s.cat,d:today(),v:0});save();closeSheet();render();toast('เพิ่ม'+s.name+'เข้าตู้เย็นแล้ว',{undo:true})};
  $('#bStock').onclick=()=>stockForm(null,{name:s.name,shopId:s.id});
  $('#bEdit').onclick=()=>fridgeForm(null,{name:s.name,qty:q,unit:u,cat:s.cat,shopId:s.id});
  $('#bSkip').onclick=()=>{snap();S.shop=S.shop.filter(x=>x.id!==s.id);save();closeSheet();render();toast('ขีด'+s.name+'ออกแล้ว',{undo:true})};
}
function stockBoughtSheet(s,tgt){
  let n=Math.max(1,s.n||1);const unit=tgt?tgt.unit:(String(s.qty).match(/[\d.]+\s*(.+)/)||[])[1]||'ชิ้น';

  ${!tgt||tgt.mode==='qty'?`<div class="bigstep"><button id="bm">−</button><span>${esc(s.name)} +${n} ${esc(unit)}</span><button id="bp">+</button></div>${tgt?`<p class="hint" style="text-align:center;margin:0">จะมีทั้งหมด ${nice(tgt.qty+n)} ${esc(tgt.unit)}</p>`:''}`
   :`<p class="hint">สถานะจะเปลี่ยนเป็น "เต็ม"</p>`}
  <div class="btns"><button class="btn primary" id="bGo">📦 ${tgt?'เพิ่มเข้าสต็อก':'สร้างในสต็อก'}</button></div>

  draw();
  const wire=()=>{if($('#bm'))$('#bm').onclick=()=>{n=Math.max(1,n-1);draw();wire()};if($('#bp'))$('#bp').onclick=()=>{n++;draw();wire()};
    $('#bGo').onclick=()=>{snap();S.shop=S.shop.filter(x=>x.id!==s.id);
      if(tgt){if(tgt.mode==='qty')tgt.qty=nice(tgt.qty+n);else tgt.level='full';save();closeSheet();render();toast(tgt.name+(tgt.mode==='qty'?' มีทั้งหมด '+nice(tgt.qty)+' '+tgt.unit:' เต็มแล้ว'),{undo:true})}
      else{const t=stplOf(s.name);S.stock.push({id:uid(),name:s.name,group:t?t[2]:(shopGroup(s)==='use'?'use':'kitchen'),sub:t?t[3]:(s.src==='item'?'อะไหล่และไส้กรอง':''),loc:'',mode:'qty',qty:n,unit,low:0,level:'full',hasExp:false,exp:'',note:''});
        save();closeSheet();render();toast('เพิ่ม'+s.name+'ในสต็อกแล้ว '+n+' '+unit,{undo:true})}};
    $('#bSkip').onclick=()=>{snap();S.shop=S.shop.filter(x=>x.id!==s.id);save();closeSheet();render();toast('ขีด'+s.name+'ออกแล้ว',{undo:true})}};
  wire();
}

const BTPL=[['ค่าน้ำ','💧','util',1,1,0],['ค่าไฟ','⚡','util',1,1,0],['อินเทอร์เน็ตบ้าน','🌐','net',0,1,0],['ค่าโทรศัพท์','📱','net',0,1,0],
 ['Netflix','🎬','sub',0,1,1],['Spotify','🎵','sub',0,1,1],['YouTube Premium','▶️','sub',0,1,1],['iCloud','☁️','sub',0,1,1],['ฟิตเนส','🏋️','sub',0,1,0],
 ['ค่าเช่า','🏠','home',0,1,0],['ค่าส่วนกลาง','🏢','home',0,12,0],['ประกันรถ','🚗','ins',0,12,0],['ประกันสุขภาพ','🩺','ins',0,12,0],['ภาษีรถและ พ.ร.บ.','🚘','ins',0,12,0],
 ['บัตรเครดิต','💳','debt',1,1,0],['ผ่อนสินค้า','📦','debt',0,1,0]];
const BEMO=['💧','⚡','🌐','📱','🎬','🎵','▶️','☁️','🎮','📚','🏋️','🏠','🏢','🚗','🩺','🛡️','💳','📦','🤖','💻'];
const baht2=n=>(isFinite(n)?n:0).toLocaleString('th-TH',{maximumFractionDigits:2});
function bOcc(b,k){const a=parse(b.anchor),day=a.getDate(),m=a.getMonth()+k*b.every,y=a.getFullYear()+Math.floor(m/12),mm=((m%12)+12)%12,last=new Date(y,mm+1,0).getDate();return fmt(new Date(y,mm,Math.min(day,last)))}
function bNext(b){const paid=new Set((b.pays||[]).map(p=>p.period));for(let k=0;k<800;k++){const d=bOcc(b,k);if(b.end&&d>b.end)return null;if(!paid.has(d))return d}return null}
const bLeft=b=>{const n=bNext(b);return n?diff(today(),n):null};
function bSt(b){if(b.paused)return 'paused';const n=bLeft(b);if(n==null)return 'done';if(b.auto)return n<=b.remind?'autosoon':'ok';if(n<0)return 'over';if(n<=b.remind)return 'soon';return 'ok'}
function bAmt(b){if(!b.var)return +b.amount||0;const p=[...(b.pays||[])].sort((x,y)=>x.date<y.date?-1:1).pop();return p?p.amount:(+b.amount||0)}
const bMonthly=b=>bAmt(b)/b.every;
function bEvery(b){return b.every===1?'ทุกเดือน วันที่ '+parse(b.anchor).getDate():b.every===12?'ทุกปี '+parse(b.anchor).toLocaleDateString('th-TH',{day:'numeric',month:'short'}):'ทุก '+b.every+' เดือน'}
function autoSettle(){let ch=false;(S.bills||[]).forEach(b=>{if(!b.auto||b.paused)return;let n=bNext(b),k=0;while(n&&n<=today()&&k++<60){b.pays=b.pays||[];b.pays.push({period:n,date:n,amount:bAmt(b),auto:true});ch=true;n=bNext(b)}});return ch}
function bMonthStats(ym){ym=ym||today().slice(0,7);let due=0,paid=0;const end=fmt(new Date(+ym.slice(0,4),+ym.slice(5,7),0));
  S.bills.filter(b=>!b.paused).forEach(b=>{for(let k=0;k<800;k++){const d=bOcc(b,k);if(d>end||(b.end&&d>b.end))break;if(d.startsWith(ym)){const p=(b.pays||[]).find(x=>x.period===d);due+=p?p.amount:bAmt(b);if(p)paid+=p.amount}}});
  return{due,paid}}

}

function viewMedExp(){
  const W=mWarn(),rows=[];
  S.meds.forEach(m=>mLots(m).forEach(l=>{if(!l.exp)return;const n=diff(today(),l.exp);if(n<=W)rows.push({m,l,n})}));
  rows.sort((a,b)=>a.n-b.n);
  let h=`<div class="field"><span class="lbl">แจ้งล่วงหน้าก่อนหมดอายุ</span><div class="seg" style="max-width:320px">${[30,60,90].map(w=>`<button class="${W===w?'on':''}" data-mwarn="${w}">${w} วัน</button>`).join('')}</div></div>`;
  if(!rows.length)return h+`<div class="card insight">ไม่มียาหมดอายุ หรือจะหมดอายุภายใน ${W} วัน</div>`;
  const ex=rows.filter(r=>r.n<0),soon=rows.filter(r=>r.n>=0);
  const row=r=>`<div class="drow"><span class="em">${mEmo(r.m)}</span><button class="nm" data-mi="${r.m.id}">${esc(r.m.name)}<small>${r.n<0?'หมดอายุ '+(-r.n)+' วันที่แล้ว':'เหลือ '+r.n+' วัน, '+thFull(r.l.exp)}, ${nice(r.l.qty)} ${esc(r.m.unit)}${r.l.lot?', ล็อต '+esc(r.l.lot):''}</small></button>${r.n<0?`<button class="cdone" data-mmanage="${r.m.id}|${r.l.id}">จัดการ</button>`:''}</div>`;
  if(ex.length)h+=`<h2 class="sec">หมดอายุแล้ว<small>${ex.length} ล็อต</small></h2><div class="card list m-med">${ex.map(row).join('')}</div>`;
  const ym=today().slice(0,7),nm=addU(ym+'-01',1,'month').slice(0,7),grp={};
  soon.forEach(r=>{const k=r.l.exp.slice(0,7),lbl=k===ym?'⚠️ เดือนนี้':k===nm?'⚠️ เดือนหน้า':parse(k+'-01').toLocaleDateString('th-TH',{month:'long',year:'numeric'});(grp[lbl]=grp[lbl]||[]).push(r)});
  Object.entries(grp).forEach(([k,v])=>{h+=`<h2 class="sec">${k}<small>${v.length} ล็อต</small></h2><div class="card list">${v.map(row).join('')}</div>`});
  return h;
}

function stepFood(f,dir){
  const st=stepOf(f),wasLow=isLow(f);
  const q=Math.max(0,nice(f.qty+dir*st));

  f.qty=q;if(q>f.init)f.init=q;save();render();
  if(dir<0&&!wasLow&&isLow(f)&&!inShop(f.name))toast(f.name+'เหลือน้อยแล้ว',{act:['ซื้อเพิ่ม',()=>{addShop({src:'fridge',ref:f.id,group:'food',name:f.name,cat:f.cat,qty:nice(f.init)+' '+f.unit});render();toast('ใส่'+f.name+'ในรายการซื้อแล้ว')}]});
}

  const inv=S.fridge.filter(f=>f.qty>0).sort((a,b)=>a.exp.localeCompare(b.exp)).map(f=>{const n=left(f);return `- ${f.name} ${nice(f.qty)} ${f.unit}, ${n<0?'หมดอายุแล้ว':'เหลือ '+n+' วัน'}`}).join('\n');
  const prompt=`คุณช่วยคิดเมนูอาหารทำเองที่บ้านสไตล์ไทย ของในตู้เย็นตอนนี้:\n${inv}\n${S.settings.staples?'ของพื้นฐานที่มีเสมอ: '+S.settings.stapleList+'\n':''}
คิด 4 เมนูที่ทำง่าย ใช้ของที่ใกล้หมดอายุก่อน ห้ามใช้ของที่หมดอายุแล้ว แต่ละเมนูขาดของได้ไม่เกิน 1 อย่าง
ตอบเป็น JSON array เท่านั้น ไม่มีข้อความอื่น แต่ละรายการมี: "name" ชื่อเมนู, "emoji" อีโมจิ 1 ตัว, "minutes" ตัวเลขเวลาทำ, "uses" ชื่อของจากตู้เย็นที่ใช้ (array), "missing" ของที่ต้องซื้อเพิ่ม (array ว่างถ้าไม่มี), "steps" ขั้นตอนสั้นๆ 3 ถึง 5 ข้อเป็นภาษาไทย (array)`;
  try{const r=await SAMPLE.json(prompt,{signal:ctrl.signal});const list=Array.isArray(r)?r:(r&&(r.menus||r.items))||[];
    aiState=list.length?{list:list.slice(0,6)}:{error:'ไม่ได้เมนูกลับมา ลองอีกครั้ง'}}
  catch(e){const c=e&&e.code;aiState=c==='cancelled'?null:{error:c==='not_granted'?'ยังไม่ได้อนุญาตให้หน้านี้ใช้ AI':c==='rate_limited'?'ใช้ AI ถี่เกินไป รอสักครู่แล้วลองใหม่':'คิดเมนูไม่สำเร็จ ลองอีกครั้ง'}}
  if(tab==='menu')render();
}
